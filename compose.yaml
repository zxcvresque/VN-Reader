name: vn-reader
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: web
    depends_on:
      accounts: {condition: service_healthy}
      archive: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
  accounts:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      target: accounts
    environment:
      VN_ENV: production
      BETTER_AUTH_URL: https://${VN_DOMAIN:?Set VN_DOMAIN to the website hostname}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a persistent secret of at least 32 characters}
      VN_ALLOWED_ORIGINS: https://${VN_DOMAIN}
      VN_ARCHIVE_ENABLED: "true"
      VN_SMTP_HOST: ${VN_SMTP_HOST:-}
      VN_SMTP_PORT: ${VN_SMTP_PORT:-587}
      VN_SMTP_USERNAME: ${VN_SMTP_USERNAME:-}
      VN_SMTP_PASSWORD: ${VN_SMTP_PASSWORD:-}
      VN_SMTP_FROM: ${VN_SMTP_FROM:-}
      VN_SMTP_SSL: ${VN_SMTP_SSL:-false}
      VN_ADMIN_EMAILS: ${VN_ADMIN_EMAILS:-}
      VN_EMAIL_DAILY_LIMIT: ${VN_EMAIL_DAILY_LIMIT:-300}
      VN_EMAIL_QUOTA_TIMEZONE: ${VN_EMAIL_QUOTA_TIMEZONE:-UTC}
    volumes: ["account-data:/data"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging: *logging
  archive:
    build:
      context: .
      dockerfile: deploy/Dockerfile.telegram
    environment: &telegram-env
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:?Set Telegram API ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?Set Telegram API hash}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set the bot token}
      TELEGRAM_SOURCE: ${TELEGRAM_SOURCE:-@Vidurneeti}
      TELEGRAM_DESTINATION: ${TELEGRAM_DESTINATION:--1004434351194}
      TELEGRAM_ARCHIVE_TOPIC_ID: ${TELEGRAM_ARCHIVE_TOPIC_ID:-}
    volumes: ["telegram-data:/data"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/archive-health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped
    logging: *logging
  mirror:
    build:
      context: .
      dockerfile: deploy/Dockerfile.telegram
    environment: *telegram-env
    command: ["python", "-u", "-m", "server.mirror", "watch"]
    volumes: ["telegram-data:/data"]
    stop_grace_period: 45s
    restart: unless-stopped
    logging: *logging
volumes:
  account-data:
  telegram-data:
